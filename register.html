<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emergence Academy - Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/style.css?v=2.0.1" />
</head>

<body class="bg-slate-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md rounded-3xl bg-white shadow-2xl p-8">
            <div class="text-center">
                <div
                    class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-600 text-xl font-bold text-white">
                    E</div>
                <h1 class="text-2xl font-bold text-slate-900">
                    Create Office Account
                </h1>

                <p class="mt-1 text-sm text-slate-500">
                    Create credentials for a school user
                </p>
            </div>
            <form id="registerForm" class="mt-6 space-y-4">
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Full Name</label>
                    <input id="registerName" type="text"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
                    <input id="registerEmail" type="email"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Password</label>
                    <div class="relative"><input id="registerPassword" type="password"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 pr-16 outline-none focus:ring-2 focus:ring-indigo-500" /><button id="toggleRegisterPassword" type="button" class="absolute inset-y-0 right-2 text-sm text-indigo-700 hover:text-indigo-900" aria-label="Show password">Show</button></div>
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Role / Office</label>
                    <select id="registerRole"
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="student">Student</option>
                        <option value="parent">Parent</option>
                        <option value="teacher">Teacher</option>
                        <option value="executive">Executive</option>
                        <option value="finance">Finance</option>
                        <option value="hr">HR</option>
                        <option value="admission">Admission</option>
                        <option value="exam">Exam</option>
                        <option value="library">Library</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div id="registerError"
                    class="hidden rounded-lg border border-rose-100 bg-rose-50 px-3 py-2 text-sm text-rose-600"></div>
                <button type="submit"
                    class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white transition hover:bg-indigo-700">Create
                    Account</button>
            </form>
            <div class="mt-4 text-center text-sm text-slate-500">
                <a href="login.html" class="font-medium text-indigo-600 hover:text-indigo-700">Already have an
                    account?</a>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js?v=2.0.1"></script>
    <script src="assets/js/supabase.js?v=2.0.1"></script>
    <script src="assets/js/logout-refresh.js?v=1.0.0"></script>
    <script src="assets/js/auth.js?v=2.2.1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('registerForm');
            const errorEl = document.getElementById('registerError');
            const passwordInput = document.getElementById('registerPassword');
            const togglePassword = document.getElementById('toggleRegisterPassword');

            togglePassword?.addEventListener('click', () => {
                const hidden = passwordInput?.type === 'password';
                if (!passwordInput) return;
                passwordInput.type = hidden ? 'text' : 'password';
                togglePassword.textContent = hidden ? 'Hide' : 'Show';
                togglePassword.setAttribute('aria-label', `${hidden ? 'Hide' : 'Show'} password`);
            });

            if (!window.Auth) {
                errorEl.textContent = 'Authentication module is unavailable.';
                errorEl.classList.remove('hidden');
                return;
            }

            const currentUser = await Auth.currentUser();
            const profile = await Auth.profile();

            if (!currentUser || !profile || !['admin', 'ceo'].includes(String(profile.role || '').toLowerCase())) {
                errorEl.textContent = 'Only an admin can create office credentials.';
                errorEl.classList.remove('hidden');
                window.setTimeout(() => {
                    window.location.replace('login.html');
                }, 700);
                return;
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const nameParts = document.getElementById('registerName').value.trim().split(/\s+/).filter(Boolean);
                const payload = {
                    email: document.getElementById('registerEmail').value.trim(),
                    password: document.getElementById('registerPassword').value,
                    role: document.getElementById('registerRole').value,
                    first_name: nameParts.shift() || '',
                    last_name: nameParts.join(' '),
                    phone: ''
                };

                const result = await Auth.createOfficeAccount(payload);

                if (result.success) {
                    errorEl.className = 'rounded-lg border border-emerald-100 bg-emerald-50 px-3 py-2 text-sm text-emerald-700';
                    const okMessage = result.message || result.data?.message || 'Account created successfully.';
                    errorEl.textContent = okMessage;
                    errorEl.classList.remove('hidden');
                } else {
                    errorEl.className = 'rounded-lg border border-rose-100 bg-rose-50 px-3 py-2 text-sm text-rose-600';
                    errorEl.textContent = result.message;
                    errorEl.classList.remove('hidden');
                }
            });
        });
    </script>
</body>

</html>
