<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergence Academy - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="bg-slate-50 min-h-screen">
  <div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md rounded-3xl bg-white shadow-2xl p-8">
      <div class="text-center">
        <div
          class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-600 text-xl font-bold text-white">
          E</div>
        <img src="assets/images/logo.jpeg" class="w-24 h-24 mb-4" alt="Emergence Academy">
        <h1 class="text-2xl font-bold text-slate-900">Emergence Academy</h1>
        <p class="mt-1 text-sm text-slate-500">Sign in to your office portal</p>
      </div>
      <form id="loginForm" class="mt-6 space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Office / Role</label>
          <select id="loginRole"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="admin">Admin</option>
            <option value="ceo">CEO</option>
            <option value="executive">Executive</option>
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
            <option value="parent">Parent</option>
          </select>
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Email or Username</label>
          <input id="loginEmail" type="text"
            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="admin@emergence.edu" value="admin@emergence.edu" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Password</label>
          <div class="relative">
            <input id="loginPassword" type="password"
              class="w-full rounded-lg border border-slate-300 px-3 py-2.5 pr-12 outline-none focus:ring-2 focus:ring-indigo-500"
              placeholder="••••••••" value="Emergence2026!" />
            <button type="button" id="togglePassword"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-sm text-slate-500"
              aria-label="Show password">Show</button>
          </div>
        </div>
        <div id="loginStatus" class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600">
        </div>
        <div id="loginError"
          class="hidden rounded-lg border border-rose-100 bg-rose-50 px-3 py-2 text-sm text-rose-600"></div>
        <button type="submit"
          class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white transition hover:bg-indigo-700">Sign
          In</button>
      </form>
      <div class="mt-4 text-center text-sm text-slate-500">
        <a href="register.html" class="font-medium text-indigo-600 hover:text-indigo-700">Admin only: create office
          credentials</a>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const form = document.getElementById('loginForm');
      const passwordInput = document.getElementById('loginPassword');
      const togglePassword = document.getElementById('togglePassword');
      const statusEl = document.getElementById('loginStatus');

      if (togglePassword && passwordInput) {
        togglePassword.addEventListener('click', () => {
          const isHidden = passwordInput.type === 'password';
          passwordInput.type = isHidden ? 'text' : 'password';
          togglePassword.textContent = isHidden ? 'Hide' : 'Show';
        });
      }

      if (statusEl) {
        statusEl.textContent = window.supabaseInitMessage || 'Supabase status unavailable.';
      }

      await Auth.bootstrapAdmin();

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const role = document.getElementById('loginRole').value;

        const result = await Auth.login(email, password, role);

        if (result.success) {
          const dashboard = await Auth.getDashboard();
          window.location.href = dashboard;
        } else {
          const errorEl = document.getElementById('loginError');
          errorEl.textContent = result.message || 'Unable to sign in.';
          errorEl.classList.remove('hidden');
        }
      });
    });
  </script>
</body>

</html>
