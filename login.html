<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergence Academy - Login</title>

    <!-- Tailwind CSS (Development) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css?v=2.0.1">

    <!-- JavaScript -->
    <script src="assets/js/config.js?v=2.0.1" defer></script>
    <script src="assets/js/supabase.js?v=2.0.1" defer></script>
    <script src="assets/js/logout-refresh.js?v=1.0.0" defer></script>
    <script src="assets/js/auth.js?v=2.0.1" defer></script>
    <script src="assets/js/login.js?v=2.0.1" defer></script>
</head>

<body class="bg-slate-50 min-h-screen">

    <div class="min-h-screen flex items-center justify-center px-4 py-8">

        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8">

            <!-- Logo -->
            <div class="text-center">

                <img
                    id="school-logo"
                    src="assets/images/logo.png?v=2.0.1"
                    alt="Emergence Academy Logo"
                    class="mx-auto h-20 w-20 object-contain mb-4"
                    onerror="this.style.display='none'">

                <h1 class="text-2xl font-bold text-slate-900">
                    Emergence Academy
                </h1>

                <p class="mt-2 text-sm text-slate-500">
                    Sign in to your office portal
                </p>

            </div>

            <!-- Login Form -->

            <form id="loginForm" class="mt-8 space-y-5">

                <!-- Role -->

                <div>

                    <label
                        for="loginRole"
                        class="block text-sm font-medium text-slate-700 mb-2">

                        Office / Role

                    </label>

                    <select
                        id="loginRole"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                        <option value="admin">Administrator</option>
                        <option value="ceo">CEO</option>
                        <option value="executive">Executive</option>
                        <option value="finance">Finance</option>
                        <option value="hr">HR</option>
                        <option value="admission">Admission</option>
                        <option value="exam">Exam</option>
                        <option value="library">Library</option>
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                        <option value="parent">Parent</option>

                    </select>

                </div>

                <!-- Email -->

                <div>

                    <label
                        for="loginEmail"
                        class="block text-sm font-medium text-slate-700 mb-2">

                        Email Address

                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        autocomplete="username"
                        placeholder="Enter your email"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                </div>

                <!-- Password -->

                <div>

                    <label
                        for="loginPassword"
                        class="block text-sm font-medium text-slate-700 mb-2">

                        Password

                    </label>

                    <div class="relative">

                        <input
                            id="loginPassword"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            class="w-full rounded-lg border border-slate-300 px-3 py-2.5 pr-14 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-500 hover:text-indigo-600">

                            Show

                        </button>

                    </div>

                </div>

                <!-- Status -->

                <div
                    id="loginStatus"
                    class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600">

                    Ready...

                </div>

                <!-- Error -->

                <div
                    id="loginError"
                    class="hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600">
                </div>

                <!-- Button -->

                <button
                    type="submit"
                    class="w-full rounded-lg bg-indigo-600 py-3 text-white font-semibold hover:bg-indigo-700 transition">

                    Sign In

                </button>

            </form>

            <div class="mt-6 text-center">

                <a
                    href="register.html"
                    class="text-sm text-indigo-600 hover:text-indigo-700">

                    Administrator: Create Office Credentials

                </a>

            </div>

        </div>

    </div>

</body>

</html>
